<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员端 · 智能文档助手</title>
<style>
  :root {
    --bg: #f3f6fb;
    --card: #fff;
    --line: #e3e9f2;
    --line-soft: #eef2f8;
    --text: #1e293b;
    --muted: #64748b;
    --faint: #94a3b8;
    --blue: #2f6fed;
    --blue-dark: #1d4ed8;
    --indigo: #4f46e5;
    --green: #16a34a;
    --amber: #d97706;
    --red: #dc2626;
    --shadow-sm: 0 1px 3px rgba(15,35,80,.06);
    --shadow-md: 0 8px 26px rgba(15,35,80,.10);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  .shell { display: flex; height: 100%; }

  /* ---------------- 侧栏 ---------------- */
  .side {
    flex: 0 0 218px; background: #fff; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 18px 14px 14px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 20px; }
  .logo {
    width: 34px; height: 34px; border-radius: 10px; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--blue), var(--indigo));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(47,111,237,.32);
  }
  .logo svg { width: 19px; height: 19px; }
  .brand b { display: block; font-size: 14px; letter-spacing: .2px; }
  .brand span { display: block; font-size: 11px; color: var(--faint); margin-top: 1px; }

  .nav { display: flex; flex-direction: column; gap: 3px; }
  .nav button {
    display: flex; align-items: center; gap: 9px; border: none; background: none;
    padding: 10px 11px; border-radius: 9px; cursor: pointer; text-align: left;
    font-size: 13px; color: #566a86; transition: all .14s;
  }
  .nav button:hover { background: #f5f8fd; color: var(--blue-dark); }
  .nav button.on {
    background: linear-gradient(135deg, #eef4ff, #e9eeff);
    color: var(--blue-dark); font-weight: 600;
  }
  .nav svg { width: 16px; height: 16px; opacity: .9; flex: 0 0 auto; }
  .nav .badge {
    margin-left: auto; background: #fee2e2; color: #b91c1c; font-size: 10.5px;
    font-weight: 700; border-radius: 999px; padding: 1px 6px; min-width: 18px; text-align: center;
  }
  .nav .badge.hide { display: none; }

  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 14px; }
  .side-foot a, .side-foot button {
    display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted);
    text-decoration: none; padding: 9px 11px; border-radius: 9px; border: 1px solid transparent;
    background: none; cursor: pointer; transition: all .14s;
  }
  .side-foot a:hover { background: #f5f8fd; color: var(--blue-dark); }
  .side-foot button:hover { background: #fef2f2; color: var(--red); }

  /* ---------------- 主区 ---------------- */
  main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  header {
    flex: 0 0 auto; height: 62px; background: #fff; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; padding: 0 26px;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .2px; }
  header .sub { font-size: 12px; color: var(--faint); margin-left: 10px; font-weight: 400; }
  .who { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: #475569; }
  .who .av {
    width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #dbeafe, #e0e7ff);
    color: var(--blue-dark); font-weight: 700; font-size: 12px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .who .av img { width: 100%; height: 100%; object-fit: cover; }
  .who .tag {
    font-size: 10.5px; background: #eef2ff; color: #4338ca; border-radius: 999px;
    padding: 2px 8px; font-weight: 600;
  }

  .scroll { flex: 1 1 auto; overflow-y: auto; padding: 22px 26px 40px; }
  .view { display: none; }
  .view.on { display: block; animation: fade .22s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* 指标卡 */
  .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat {
    background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 15px 16px;
    box-shadow: var(--shadow-sm);
  }
  .stat .k { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .stat .k i { width: 6px; height: 6px; border-radius: 50%; background: #cbd5e1; font-style: normal; }
  .stat .v { font-size: 25px; font-weight: 700; line-height: 1.25; margin-top: 6px; letter-spacing: -.5px; }
  .stat .n { font-size: 11px; color: var(--faint); margin-top: 2px; }
  .stat.b .v { color: var(--blue-dark); }
  .stat.g .v { color: var(--green); }
  .stat.a .v { color: var(--amber); }
  .stat.r .v { color: var(--red); }

  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow-sm); overflow: hidden;
  }
  .card + .card { margin-top: 16px; }
  .ov-grid { display: grid; grid-template-columns: minmax(0, 1.85fr) minmax(0, 1fr); gap: 16px; }
  .ov-grid .card + .card { margin-top: 0; }
  @media (max-width: 1100px) { .ov-grid { grid-template-columns: 1fr; } .ov-grid .card + .card { margin-top: 0; } }

  /* 概览右侧：坐席小行 */
  .ov-s { display: flex; align-items: center; gap: 9px; padding: 11px 18px; border-bottom: 1px solid #f4f7fc; }
  .ov-s:last-child { border-bottom: none; }
  .ov-s .d { width: 7px; height: 7px; border-radius: 50%; background: #cbd5e1; flex: 0 0 auto; }
  .ov-s .d.on { background: var(--green); box-shadow: 0 0 0 3px rgba(22,163,74,.13); }
  .ov-s b { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ov-s .n { margin-left: auto; font-size: 11px; color: var(--faint); white-space: nowrap; }
  .card-hd {
    display: flex; align-items: center; gap: 10px; padding: 14px 18px;
    border-bottom: 1px solid var(--line-soft);
  }
  .card-hd b { font-size: 13.5px; }
  .card-hd .cnt { font-size: 11.5px; color: var(--faint); }
  .card-hd .sp { margin-left: auto; display: flex; gap: 8px; align-items: center; }

  .btn {
    border: 1px solid var(--line); background: #fff; color: #475569; border-radius: 8px;
    padding: 7px 12px; font-size: 12.5px; cursor: pointer; transition: all .14s;
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .btn:hover { border-color: #cfdcf1; background: #f8fbff; color: var(--blue-dark); }
  .btn.primary {
    background: linear-gradient(135deg, var(--blue), #3d63e8); color: #fff; border-color: transparent;
    box-shadow: 0 3px 10px rgba(47,111,237,.28);
  }
  .btn.primary:hover { filter: brightness(1.05); color: #fff; }
  .btn.danger { color: var(--red); border-color: #f3d3d3; }
  .btn.danger:hover { background: #fef2f2; border-color: #f0bcbc; color: #b91c1c; }
  .btn.sm { padding: 5px 9px; font-size: 12px; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }

  .search {
    border: 1px solid var(--line); background: #fbfdff; border-radius: 8px;
    padding: 7px 11px; font-size: 12.5px; font-family: inherit; color: var(--text);
    outline: none; width: 200px; transition: all .14s;
  }
  .search:focus { border-color: #b9cffa; box-shadow: 0 0 0 3px rgba(47,111,237,.10); background: #fff; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 11px 18px; font-size: 12.5px; }
  th { background: #fafcff; color: var(--muted); font-weight: 600; font-size: 11.5px; border-bottom: 1px solid var(--line-soft); }
  td { border-bottom: 1px solid #f4f7fc; color: #334155; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #fafcff; }
  .u-cell { display: flex; align-items: center; gap: 9px; }
  .u-cell .av {
    width: 28px; height: 28px; border-radius: 50%; background: #e8effd; color: var(--blue-dark);
    font-weight: 700; font-size: 11.5px; display: flex; align-items: center; justify-content: center;
    overflow: hidden; flex: 0 0 auto;
  }
  .u-cell .av img { width: 100%; height: 100%; object-fit: cover; }
  .u-cell b { font-weight: 600; font-size: 12.5px; display: block; }
  .u-cell span { font-size: 11px; color: var(--faint); }

  .pill {
    display: inline-flex; align-items: center; gap: 4px; border-radius: 999px;
    padding: 2px 8px; font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .pill.blue { background: #eef4ff; color: #1d4ed8; }
  .pill.green { background: #ecfdf3; color: #15803d; }
  .pill.gray { background: #f1f5f9; color: #64748b; }
  .pill.amber { background: #fff7ed; color: #c2410c; }
  .pill.red { background: #fef2f2; color: #b91c1c; }
  .pill.indigo { background: #eef2ff; color: #4338ca; }
  .pill i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; font-style: normal; }

  .empty { padding: 42px 20px; text-align: center; color: var(--faint); font-size: 12.5px; }
  .empty .ic { font-size: 26px; opacity: .5; display: block; margin-bottom: 8px; }

  /* 弹窗 */
  .mask {
    position: fixed; inset: 0; background: rgba(15,23,42,.42); backdrop-filter: blur(2px);
    display: none; align-items: center; justify-content: center; z-index: 60; padding: 20px;
  }
  .mask.on { display: flex; }
  .modal {
    width: min(420px, 100%); background: #fff; border-radius: 16px; box-shadow: var(--shadow-md);
    overflow: hidden; animation: pop .2s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.96) translateY(8px); } to { opacity: 1; transform: none; } }
  .modal-hd { padding: 18px 20px 0; }
  .modal-hd b { font-size: 15px; }
  .modal-hd p { margin: 6px 0 0; font-size: 12px; color: var(--muted); line-height: 1.6; }
  .modal-bd { padding: 16px 20px 4px; }
  .modal-ft { padding: 14px 20px 18px; display: flex; gap: 8px; justify-content: flex-end; }
  .fld { margin-bottom: 12px; }
  .fld label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  .fld input {
    width: 100%; border: 1px solid var(--line); border-radius: 9px; background: #fbfdff;
    padding: 10px 12px; font-size: 13px; font-family: inherit; outline: none; transition: all .14s;
  }
  .fld input:focus { border-color: #b9cffa; box-shadow: 0 0 0 3px rgba(47,111,237,.10); background: #fff; }
  .roles { display: flex; flex-direction: column; gap: 8px; }
  .roles label {
    display: flex; align-items: center; gap: 9px; border: 1px solid var(--line);
    border-radius: 9px; padding: 10px 12px; cursor: pointer; font-size: 12.5px; transition: all .14s;
  }
  .roles label:hover { border-color: #cfdcf1; background: #fafcff; }
  .roles input { width: 15px; height: 15px; accent-color: var(--blue); }
  .roles small { color: var(--faint); font-size: 11px; margin-left: auto; }
  .tip-msg { font-size: 12px; color: var(--red); min-height: 17px; margin-top: 4px; }

  /* 会话详情抽屉 */
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 94vw); background: #fff;
    box-shadow: -12px 0 40px rgba(15,23,80,.14); transform: translateX(102%);
    transition: transform .24s cubic-bezier(.3,.8,.3,1); z-index: 65; display: flex; flex-direction: column;
  }
  .drawer.on { transform: none; }
  .drawer-hd { padding: 16px 20px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 10px; }
  .drawer-hd b { font-size: 14px; }
  .drawer-hd .x { margin-left: auto; border: none; background: none; font-size: 18px; color: var(--faint); cursor: pointer; }
  .drawer-bd { flex: 1 1 auto; overflow-y: auto; padding: 18px 20px; background: #f8fafd; }
  .bubble { display: flex; margin-bottom: 12px; }
  .bubble .bl {
    max-width: 82%; padding: 9px 12px; border-radius: 12px; font-size: 12.5px; line-height: 1.6;
    background: #fff; border: 1px solid var(--line); white-space: pre-wrap; word-break: break-word;
  }
  .bubble .who2 { font-size: 10.5px; color: var(--faint); margin-bottom: 4px; }
  .bubble.user { justify-content: flex-end; }
  .bubble.user .bl { background: linear-gradient(135deg, #3d7df6, #2f6fed); color: #fff; border-color: transparent; }
  .bubble.staff .bl { background: #eef4ff; border-color: #dbe7fd; }
  .bubble.system { justify-content: center; }
  .bubble.system .bl { background: transparent; border: none; color: var(--faint); font-size: 11.5px; padding: 2px; }

  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 14px);
    background: #1e293b; color: #fff; font-size: 12.5px; padding: 10px 18px; border-radius: 10px;
    opacity: 0; pointer-events: none; transition: all .22s; z-index: 90; box-shadow: var(--shadow-md);
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: #b91c1c; }

  @media (max-width: 1180px) { .stats { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 900px) {
    .side { flex-basis: 64px; padding: 14px 8px; }
    .brand span, .brand b, .nav button span, .side-foot a span, .side-foot button span { display: none; }
    .nav button { justify-content: center; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .scroll { padding: 16px; }
  }
  /* ---------------- 评价反馈 ---------------- */
  .stats.four { grid-template-columns: repeat(4, 1fr); }
  .fb-stars { color: #f59e0b; letter-spacing: 1.5px; font-size: 12.5px; white-space: nowrap; }
  .fb-stars.none { color: #cbd5e1; }
  .fb-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 2px;
    border-bottom: 1px dashed #eef1f7; font-size: 12.5px;
  }
  .fb-row:last-child { border-bottom: none; }
  .fb-row .nm { width: 86px; color: #334155; }
  .fb-row .bar { flex: 1 1 auto; height: 7px; background: #eef2f8; border-radius: 999px; overflow: hidden; }
  .fb-row .bar i { display: block; height: 100%; background: linear-gradient(90deg,#93c5fd,#3b82f6); border-radius: 999px; }
  .fb-row b { width: 34px; text-align: right; }
  .fb-row .ct { width: 50px; text-align: right; color: #94a3b8; font-size: 11.5px; }
  .fb-tags-mini { display: flex; gap: 4px; flex-wrap: wrap; }
  .fb-tags-mini i, .fb-item .tags i {
    font-style: normal; font-size: 11px; background: #f1f5f9; color: #475569;
    border-radius: 999px; padding: 2px 7px;
  }
  .fb-txt { max-width: 320px; color: #475569; line-height: 1.6; }
  /* 评价卡片（列表比表格更耐窄） */
  .fb-item { border: 1px solid #eef1f7; border-radius: 10px; padding: 10px 13px; margin-bottom: 9px; }
  .fb-item:last-child { margin-bottom: 0; }
  .fb-item .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; }
  .fb-item .top b { font-weight: 600; color: #1e293b; }
  .fb-item .top .tp { margin-left: auto; color: #94a3b8; font-size: 11.5px; white-space: nowrap; }
  .fb-item .ct { margin-top: 7px; font-size: 12.5px; color: #334155; line-height: 1.75; white-space: pre-wrap; }
  .fb-item .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
  .fb-item .ft { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .fb-item .ft .btn { margin-left: auto; }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path>
          <path d="M14 3v5h5"></path><path d="M9 13h6M9 17h4"></path>
        </svg>
      </div>
      <div><b>智能文档助手</b><span>管理员端</span></div>
    </div>

    <nav class="nav" id="nav">
      <button class="on" data-view="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h7V3H3zM14 21h7V10h-7zM3 21h7v-5H3zM14 6h7V3h-7z"></path></svg>
        <span>概览</span>
      </button>
      <button data-view="users">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9.5" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path></svg>
        <span>用户管理</span>
      </button>
      <button data-view="staff">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <span>客服坐席</span>
        <em class="badge hide" id="nav-wait">0</em>
      </button>
      <button data-view="sessions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H5.2L4 17.2z"></path><path d="M8 9h8M8 12h5"></path></svg>
        <span>咨询记录</span>
      </button>
      <button data-view="feedback">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8L3.5 9.2l5.9-.9z"></path></svg>
        <span>评价反馈</span>
        <em class="badge hide" id="nav-fb">0</em>
      </button>
    </nav>

    <div class="side-foot">
      <a href="/"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg><span>回到用户端</span></a>
      <button id="logout"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5M21 12H9"></path></svg><span>退出登录</span></button>
    </div>
  </aside>

  <main>
    <header>
      <div><h1 id="page-title">概览</h1><span class="sub" id="page-sub">系统运行情况一览</span></div>
      <div class="who">
        <div class="av" id="me-av">管</div>
        <span id="me-name">…</span>
        <span class="tag">管理员</span>
      </div>
    </header>

    <div class="scroll">
      <!-- 概览 -->
      <section class="view on" id="view-overview">
        <div class="stats">
          <div class="stat b"><div class="k"><i></i>注册用户</div><div class="v" id="s-users">–</div><div class="n" id="s-users-today">今日 +0</div></div>
          <div class="stat g"><div class="k"><i style="background:#86efac"></i>在线客服</div><div class="v" id="s-online">–</div><div class="n" id="s-staff">共 0 位坐席</div></div>
          <div class="stat a"><div class="k"><i style="background:#fdba74"></i>排队等待</div><div class="v" id="s-waiting">–</div><div class="n">等待客服接入</div></div>
          <div class="stat b"><div class="k"><i style="background:#93c5fd"></i>正在接待</div><div class="v" id="s-active">–</div><div class="n">进行中的会话</div></div>
          <div class="stat"><div class="k"><i style="background:#c7d2fe"></i>咨询总数</div><div class="v" id="s-total">–</div><div class="n">累计会话</div></div>
          <div class="stat"><div class="k"><i style="background:#a5b4fc"></i>今日消息</div><div class="v" id="s-msgs">–</div><div class="n">收发合计</div></div>
        </div>

        <div class="ov-grid">
          <div class="card">
            <div class="card-hd"><b>最近咨询</b><span class="cnt" id="recent-cnt"></span>
              <div class="sp"><button class="btn sm" id="refresh-overview">刷新</button></div>
            </div>

            <div class="card-hd"><b>客服在线</b><span class="cnt" id="ov-staff-cnt"></span></div>

      <!-- 用户管理 -->

      <!-- 评价反馈 -->
      <section class="view" id="view-feedback">
        <div class="stats four">
          <div class="stat b"><div class="k"><i></i>平均满意度</div><div class="v" id="fb-avg">–</div><div class="n" id="fb-avg-n">暂无评分</div></div>
          <div class="stat g"><div class="k"><i style="background:#86efac"></i>评价总数</div><div class="v" id="fb-total">–</div><div class="n">含只写意见的反馈</div></div>
          <div class="stat a"><div class="k"><i style="background:#fdba74"></i>待处理</div><div class="v" id="fb-unread">–</div><div class="n">还没人看过</div></div>
          <div class="stat"><div class="k"><i style="background:#93c5fd"></i>今日新增</div><div class="v" id="fb-today">–</div><div class="n">今天提交</div></div>
        </div>

        <div class="ov-grid">
          <div class="card">
            <div class="card-hd"><b>用户评价与意见</b><span class="cnt" id="fb-cnt"></span>
              <div class="sp">
                <select class="search" id="fb-feature" style="width:130px">
                  <option value="">全部功能</option>
                  <option value="doc_edit">文档操作</option>
                  <option value="extract">识别入库</option>
                  <option value="fill">表格填写</option>
                  <option value="voice">语音输入</option>
                  <option value="image">图片插入</option>
                  <option value="chat">客服咨询</option>
                  <option value="other">整体 / 其他</option>
                </select>
                <select class="search" id="fb-status" style="width:112px">
                  <option value="">全部状态</option>
                  <option value="new">待处理</option>
                  <option value="read">已查看</option>
                  <option value="done">已处理</option>
                </select>
                <button class="btn sm" id="fb-refresh">刷新</button>

</div>

<div class="mask" id="mask-new">
  <div class="modal">

    <div class="modal-bd">
      <div class="fld"><label>账号</label><input id="ns-user" maxlength="20" autocomplete="off"></div>

<!-- 会话详情 -->
<div class="drawer" id="drawer">
  <div class="drawer-hd"><b id="dr-title">咨询详情</b><span class="pill gray" id="dr-status"></span>
    <button class="x" id="dr-x">×</button>
  </div>
  <div class="drawer-bd" id="dr-body"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const initial = (s) => String(s || "?").trim().slice(0, 1).toUpperCase();

let me = null;
let users = [];
let editing = null;

const STATUS_TEXT = { ai: ["AI 咨询", "gray"], waiting: ["排队中", "amber"],
                      active: ["接待中", "green"], closed: ["已结束", "gray"] };
const MODE_TEXT = { ai: "AI", human: "人工" };

function toast(text, err) {
  const t = $("toast");
  t.textContent = text;
  t.className = "toast on" + (err ? " err" : "");
  clearTimeout(t._t);
  t._t = setTimeout(() => { t.className = "toast" + (err ? " err" : ""); }, 2400);
}

async function api(path, opts) {
  const o = Object.assign({ headers: { "Content-Type": "application/json" } }, opts || {});
  const r = await fetch(path, o);
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (r.status === 401) { location.href = "/login?portal=admin"; throw new Error("登录已过期"); }
  if (!r.ok) throw new Error(j.detail || ("请求失败 HTTP " + r.status));
  return j;
}

/* ---------------- 导航 ---------------- */
const TITLES = {
  overview: ["概览", "系统运行情况一览"],
  users: ["用户管理", "账号、权限与登录状态"],
  staff: ["客服坐席", "在线状态与接待量"],
  sessions: ["咨询记录", "每一次对话都可回溯"],
  feedback: ["评价反馈", "用户怎么打分、说了什么，都在这儿"],
};

$("nav").onclick = (e) => {
  const b = e.target.closest("button[data-view]");
  if (!b) return;
  const view = b.dataset.view;
  document.querySelectorAll("#nav button").forEach((x) => x.classList.toggle("on", x === b));
  document.querySelectorAll(".view").forEach((x) => x.classList.toggle("on", x.id === "view-" + view));
  $("page-title").textContent = TITLES[view][0];
  $("page-sub").textContent = TITLES[view][1];
  if (view === "overview") loadOverview();
  if (view === "users") loadUsers();
  if (view === "staff") loadStaff();
  if (view === "sessions") loadSessions();
  if (view === "feedback") loadFeedback();
};

/* ---------------- 概览 ---------------- */
async function loadOverview() {
  try {
    const j = await api("/api/admin/overview");
    const s = j.stats;
    $("s-users").textContent = s.users;
    $("s-users-today").textContent = "今日 +" + s.users_today;
    $("s-online").textContent = s.staff_online;
    $("s-staff").textContent = "共 " + s.staff + " 位坐席";
    $("s-waiting").textContent = s.sessions_waiting;
    $("s-active").textContent = s.sessions_active;
    $("s-total").textContent = s.sessions_total;
    $("s-msgs").textContent = s.messages_today;
    const bw = $("nav-wait");
    bw.textContent = s.sessions_waiting;
    bw.classList.toggle("hide", !s.sessions_waiting);
  } catch (e) { toast(e.message, true); }

  try {
    const j = await api("/api/admin/sessions?limit=6");
    $("recent-cnt").textContent = "共 " + j.sessions.length + " 条";
    $("recent-box").innerHTML = sessionsTable(j.sessions, true);
  } catch (e) { /* 概览失败不叠加提示 */ }

  try {
    const j = await api("/api/admin/staff");
    const list = j.staff || [];
    const on = list.filter((s) => s.online).length;
    $("ov-staff-cnt").textContent = `${on} 在线 / ${list.length} 位`;
    $("ov-staff").innerHTML = list.length
      ? list.map((s) => `<div class="ov-s"><span class="d ${s.online ? "on" : ""}"></span>
          <b>${esc(s.display_name)}</b>
          <span class="n">${s.online ? (s.active ? s.active + " 个接待中" : "空闲") : "离线"}</span></div>`).join("")
      : `<div class="empty"><span class="ic">🎧</span>还没有客服账号</div>`;
  } catch (e) { /* 忽略 */ }
}

/* ---------------- 用户管理 ---------------- */
function rolePills(roles) {
  const map = { user: ["用户端", "blue"], staff: ["客服端", "indigo"], admin: ["管理员", "green"] };
  return (roles || []).map((r) => {
    const m = map[r] || [r, "gray"];
    return `<span class="pill ${m[1]}">${m[0]}</span>`;
  }).join(" ");
}

async function loadUsers() {
  const q = $("user-q").value.trim();
  try {
    const j = await api("/api/admin/users?q=" + encodeURIComponent(q));
    users = j.users;
    $("users-cnt").textContent = "共 " + users.length + " 个账号";
    if (!users.length) {
      $("users-box").innerHTML = `<div class="empty"><span class="ic">🔍</span>没有匹配的账号</div>`;
      return;
    }
    $("users-box").innerHTML = `<table>
      <thead><tr><th>账号</th><th>权限</th><th>状态</th><th>注册时间</th><th>最近登录</th><th style="text-align:right">操作</th></tr></thead>
      <tbody>${users.map((u) => `
        <tr>
          <td><div class="u-cell"><div class="av">${u.avatar ? `<img src="${esc(u.avatar)}" alt="">` : initial(u.display_name)}</div>
            <div><b>${esc(u.display_name)}</b><span>@${esc(u.username)}</span></div></div></td>
          <td>${rolePills(u.roles)}</td>
          <td>${u.status === "active" ? '<span class="pill green"><i></i>正常</span>' : '<span class="pill red"><i></i>已停用</span>'}</td>
          <td>${esc((u.created_at || "").slice(0, 16))}</td>
          <td>${esc((u.last_login || "").slice(0, 16) || "—")}</td>
          <td style="text-align:right; white-space:nowrap">
            <button class="btn sm" data-act="roles" data-id="${u.id}">权限</button>
            <button class="btn sm" data-act="pwd" data-id="${u.id}">重置密码</button>
            <button class="btn sm ${u.status === "active" ? "danger" : ""}" data-act="status" data-id="${u.id}">
              ${u.status === "active" ? "停用" : "启用"}</button>
          </td>
        </tr>`).join("")}</tbody></table>`;
  } catch (e) {
    $("users-box").innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

$("users-box").onclick = async (e) => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const u = users.find((x) => String(x.id) === b.dataset.id);
  if (!u) return;
  if (b.dataset.act === "roles") {
    editing = u;
    $("roles-who").textContent = "@" + u.username + " · " + u.display_name;
    $("r-user").checked = u.roles.includes("user");
    $("r-staff").checked = u.roles.includes("staff");
    $("r-admin").checked = u.roles.includes("admin");
    $("roles-msg").textContent = "";
    $("mask-roles").classList.add("on");
  }
  if (b.dataset.act === "pwd") {
    editing = u;
    $("pwd-who").textContent = "@" + u.username + " · " + u.display_name;
    $("pwd-new").value = "";
    $("pwd-msg").textContent = "";
    $("mask-pwd").classList.add("on");
    setTimeout(() => $("pwd-new").focus(), 60);
  }
  if (b.dataset.act === "status") {
    const next = u.status === "active" ? "disabled" : "active";
    if (next === "disabled" && !confirm(`确定停用「${u.display_name}」？停用后该账号会立即退出登录。`)) return;
    try {
      await api(`/api/admin/users/${u.id}/status`, { method: "POST", body: JSON.stringify({ status: next }) });
      toast(next === "disabled" ? "已停用" : "已启用");
      loadUsers();
      loadOverview();
    } catch (err) { toast(err.message, true); }
  }
};

$("roles-save").onclick = async () => {
  if (!editing) return;
  const roles = ["user", "staff", "admin"].filter((r) => $("r-" + r).checked);
  if (!roles.length) { $("roles-msg").textContent = "至少要给一个权限"; return; }
  try {
    await api(`/api/admin/users/${editing.id}/roles`, { method: "POST", body: JSON.stringify({ roles }) });
    $("mask-roles").classList.remove("on");
    toast("权限已更新");
    loadUsers();
    if (editing.id === me.id) boot();
  } catch (e) { $("roles-msg").textContent = e.message; }
};

$("pwd-save").onclick = async () => {
  if (!editing) return;
  const pwd = $("pwd-new").value;
  if (pwd.length < 6) { $("pwd-msg").textContent = "密码至少 6 位"; return; }
  try {
    await api(`/api/admin/users/${editing.id}/password`, { method: "POST", body: JSON.stringify({ password: pwd }) });
    $("mask-pwd").classList.remove("on");
    toast("密码已重置，该账号的登录状态已失效");
  } catch (e) { $("pwd-msg").textContent = e.message; }
};

/* ---------------- 客服坐席 ---------------- */
async function loadStaff() {
  try {
    const j = await api("/api/admin/staff");
    const list = j.staff;
    $("staff-cnt").textContent = `${list.filter((s) => s.online).length} 在线 / 共 ${list.length} 位`;
    if (!list.length) {
      $("staff-box").innerHTML = `<div class="empty"><span class="ic">🎧</span>还没有客服账号，到「用户管理」新建一个</div>`;
      return;
    }
    $("staff-box").innerHTML = `<table>
      <thead><tr><th>客服</th><th>在线状态</th><th>当前接待</th><th>今日接待</th><th>最近活跃</th></tr></thead>
      <tbody>${list.map((s) => `
        <tr>
          <td><div class="u-cell"><div class="av">${s.avatar ? `<img src="${esc(s.avatar)}" alt="">` : initial(s.display_name)}</div>
            <div><b>${esc(s.display_name)}</b><span>@${esc(s.username)}</span></div></div></td>
          <td>${s.online ? '<span class="pill green"><i></i>在线</span>' : '<span class="pill gray"><i></i>离线</span>'}</td>
          <td>${s.active ? `<span class="pill blue">${s.active} 个会话</span>` : '<span style="color:#94a3b8">—</span>'}</td>
          <td>${s.today} 次</td>
          <td>${esc((s.last_seen || "").slice(5, 16) || "—")}</td>
        </tr>`).join("")}</tbody></table>`;
  } catch (e) {
    $("staff-box").innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

/* ---------------- 咨询记录 ---------------- */
function sessionsTable(list, compact) {
  if (!list.length) return `<div class="empty"><span class="ic">🗂</span>暂无咨询记录</div>`;
  return `<table>
    <thead><tr><th>用户</th><th>方式</th><th>状态</th><th>接待客服</th>${compact ? "" : "<th>消息</th>"}<th>开始时间</th><th></th></tr></thead>
    <tbody>${list.map((s) => {
      const st = STATUS_TEXT[s.status] || [s.status, "gray"];
      return `<tr>
        <td><b>${esc(s.user_name || ("用户 #" + s.user_id))}</b></td>
        <td><span class="pill ${s.mode === "ai" ? "gray" : "indigo"}">${MODE_TEXT[s.mode] || s.mode}</span></td>
        <td><span class="pill ${st[1]}"><i></i>${st[0]}</span></td>
        <td>${esc(s.staff_name || "—")}</td>
        ${compact ? "" : `<td>${s.msg_count || 0}</td>`}
        <td>${esc((s.created_at || "").slice(5, 16))}</td>
        <td style="text-align:right"><button class="btn sm" data-sess="${s.id}">查看</button></td>
      </tr>`;
    }).join("")}</tbody></table>`;
}

async function loadSessions() {
  const st = $("sess-status").value;
  try {
    const j = await api("/api/admin/sessions?limit=100" + (st ? "&status=" + st : ""));
    $("sess-cnt").textContent = "共 " + j.sessions.length + " 条";
    $("sess-box").innerHTML = sessionsTable(j.sessions, false);
  } catch (e) {
    $("sess-box").innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

/* ---------------- 评价反馈 ---------------- */
const FB_STATUS = { new: ["待处理", "amber"], read: ["已查看", "gray"], done: ["已处理", "green"] };

function starStr(n) {
  return n ? "★".repeat(n) + "☆".repeat(5 - n) : "";
}

function fbTable(list) {
  if (!list.length) return `<div class="empty"><span class="ic">💬</span>还没有评价，用户用起来之后这里就会有</div>`;
  return list.map((f) => {
    const st = FB_STATUS[f.status] || [f.status, "gray"];
    const tags = (f.tags || "").split(",").filter(Boolean);
    return `<div class="fb-item">
      <div class="top">
        <b>${esc(f.user_name)}</b>
        <span class="pill indigo">${esc(f.feature_text)}</span>
        <span class="fb-stars${f.rating ? "" : " none"}" title="${f.rating ? f.rating + " 星" : "没打分"}">${f.rating ? starStr(f.rating) : "—"}</span>
        <span class="tp">${esc((f.created_at || "").slice(5, 16))}</span>
      </div>
      ${f.content ? `<div class="ct">${esc(f.content)}</div>` : ""}
      ${tags.length ? `<div class="tags">${tags.map((t) => `<i>${esc(t)}</i>`).join("")}</div>` : ""}
      <div class="ft">
        <span class="pill ${st[1]}"><i></i>${st[0]}</span>
        ${f.status === "done" ? "" : `<button class="btn sm" data-fbdone="${f.id}">标为已处理</button>`}
      </div>
    </div>`;
  }).join("");
}

async function loadFeedback() {
  const feature = $("fb-feature").value;
  const status = $("fb-status").value;
  const qs = [];
  if (feature) qs.push("feature=" + encodeURIComponent(feature));
  if (status) qs.push("status=" + encodeURIComponent(status));
  try {
    const j = await api("/api/admin/feedback?limit=200" + (qs.length ? "&" + qs.join("&") : ""));
    const s = j.stats || {};
    $("fb-avg").textContent = s.avg ? s.avg.toFixed(1) : "—";
    $("fb-avg-n").textContent = s.rated ? `共 ${s.rated} 条评分` : "暂无评分";
    $("fb-total").textContent = s.total || 0;
    $("fb-unread").textContent = s.unread || 0;
    $("fb-today").textContent = s.today || 0;
    const bw = $("nav-fb");
    bw.textContent = s.unread || 0;
    bw.classList.toggle("hide", !s.unread);

    $("fb-cnt").textContent = "共 " + (j.items || []).length + " 条";
    $("fb-box").innerHTML = fbTable(j.items || []);

    const by = s.by_feature || [];
    $("fb-by").innerHTML = by.length ? by.map((r) => `
      <div class="fb-row">
        <span class="nm">${esc(r.name)}</span>
        <span class="bar"><i style="width:${Math.round((r.avg || 0) / 5 * 100)}%"></i></span>
        <b>${r.avg ? r.avg.toFixed(1) : "—"}</b>
        <span class="ct">${r.count} 条</span>
      </div>`).join("")
      : `<div class="empty">还没有评价</div>`;
  } catch (e) {
    $("fb-box").innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

$("fb-refresh").onclick = () => loadFeedback();
$("fb-feature").onchange = () => loadFeedback();
$("fb-status").onchange = () => loadFeedback();

document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-fbdone]");
  if (!b) return;
  b.disabled = true;
  try {
    await api("/api/admin/feedback/" + b.dataset.fbdone + "/status",
      { method: "POST", body: JSON.stringify({ status: "done" }) });
    toast("已标记为已处理");
    loadFeedback();
  } catch (err) {
    toast(err.message, true);
    b.disabled = false;
  }
});

document.addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-sess]");
  if (!b) return;
  try {
    const j = await api("/api/admin/session/" + b.dataset.sess);
    const s = j.session;
    const st = STATUS_TEXT[s.status] || [s.status, "gray"];
    $("dr-title").textContent = (s.user_name || ("用户 #" + s.user_id)) + " 的咨询";
    $("dr-status").textContent = st[0];
    $("dr-status").className = "pill " + st[1];
    $("dr-body").innerHTML = j.messages.map((m) => {
      if (m.sender === "system") return `<div class="bubble system"><div class="bl">${esc(m.content)}</div></div>`;
      const who = m.sender === "user" ? (s.user_name || "用户")
                : m.sender === "ai" ? "智能客服" : (m.sender_name || "客服");
      return `<div class="bubble ${m.sender}"><div><div class="who2">${esc(who)} · ${esc((m.created_at || "").slice(11, 16))}</div>
        <div class="bl">${esc(m.content)}</div></div></div>`;
    }).join("") || `<div class="empty">没有消息</div>`;
    $("drawer").classList.add("on");
  } catch (err) { toast(err.message, true); }
});

$("dr-x").onclick = () => $("drawer").classList.remove("on");

/* ---------------- 弹窗通用关闭 ---------------- */
document.querySelectorAll("[data-close]").forEach((b) => {
  b.onclick = () => $(b.dataset.close).classList.remove("on");
});
document.querySelectorAll(".mask").forEach((m) => {
  m.onclick = (e) => { if (e.target === m) m.classList.remove("on"); };
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    document.querySelectorAll(".mask.on").forEach((m) => m.classList.remove("on"));
    $("drawer").classList.remove("on");
  }
});

/* ---------------- 新建客服 ---------------- */
$("new-staff").onclick = () => {
  $("ns-user").value = ""; $("ns-pwd").value = ""; $("ns-name").value = "";
  $("ns-msg").textContent = "";
  $("mask-new").classList.add("on");
  setTimeout(() => $("ns-user").focus(), 60);
};
$("ns-save").onclick = async () => {
  const username = $("ns-user").value.trim();
  const password = $("ns-pwd").value;
  if (!username) { $("ns-msg").textContent = "先填账号"; return; }
  if (password.length < 6) { $("ns-msg").textContent = "密码至少 6 位"; return; }
  try {
    await api("/api/admin/users", { method: "POST",
      body: JSON.stringify({ username, password, display_name: $("ns-name").value.trim() }) });
    $("mask-new").classList.remove("on");
    toast("客服账号已创建，可登录客服端");
    loadUsers(); loadOverview();
  } catch (e) { $("ns-msg").textContent = e.message; }
};

/* ---------------- 退出 / 启动 ---------------- */
$("logout").onclick = async () => {
  try { await fetch("/api/auth/logout", { method: "POST" }); } catch (e) {}
  location.href = "/login?portal=admin";
};

let qTimer = null;
$("user-q").oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(loadUsers, 260); };
$("refresh-overview").onclick = loadOverview;
$("refresh-staff").onclick = loadStaff;
$("refresh-sess").onclick = loadSessions;
$("sess-status").onchange = loadSessions;

async function boot() {
  try {
    const r = await fetch("/api/auth/me");
    const j = await r.json();
    const u = j.user;
    if (!u || !(u.roles || []).includes("admin")) { location.href = "/login?portal=admin"; return; }
    me = u;
    $("me-name").textContent = u.display_name || u.username;
    $("me-av").innerHTML = u.avatar ? `<img src="${esc(u.avatar)}" alt="">` : esc(initial(u.display_name));
    loadOverview();
  } catch (e) {
    location.href = "/login?portal=admin";
  }
}
boot();
setInterval(() => { if (document.visibilityState === "visible") loadOverview(); }, 20000);
</script>
</body>
</html>
