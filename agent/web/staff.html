<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客服工作台 · 智能文档助手</title>
<style>
  :root {
    --bg: #f3f6fb;
    --card: #fff;
    --line: #e3e9f2;
    --line-soft: #edf2f9;
    --text: #1e293b;
    --muted: #64748b;
    --faint: #94a3b8;
    --blue: #2f6fed;
    --blue-dark: #1d4ed8;
    --indigo: #4f46e5;
    --green: #16a34a;
    --amber: #d97706;
    --red: #dc2626;
    --shadow-sm: 0 1px 3px rgba(15,35,80,.06);
    --shadow-md: 0 10px 30px rgba(15,35,80,.12);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  button { font-family: inherit; }

  /* ---------------- 顶栏 ---------------- */
  header {
    flex: 0 0 auto; height: 58px; background: #fff; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; padding: 0 20px;
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .logo {
    width: 30px; height: 30px; border-radius: 9px; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--blue), var(--indigo));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 9px rgba(47,111,237,.30);
  }
  .logo svg { width: 17px; height: 17px; }
  .brand b { font-size: 13.5px; }
  .brand span {
    font-size: 10.5px; color: #4338ca; background: #eef2ff; border-radius: 999px;
    padding: 2px 7px; margin-left: 4px; font-weight: 600;
  }
  .live {
    display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--green);
    margin-left: 4px; padding-left: 16px; border-left: 1px solid var(--line); font-weight: 600;
  }
  .live i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 0 3px rgba(22,163,74,.16); animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

  .hdr-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .hdr-right .who { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #475569; }
  .who .av {
    width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #dbeafe, #e0e7ff);
    color: var(--blue-dark); font-weight: 700; font-size: 12px; display: flex;
    align-items: center; justify-content: center; overflow: hidden;
  }
  .who .av img { width: 100%; height: 100%; object-fit: cover; }
  .ghost {
    border: 1px solid var(--line); background: #fff; color: #475569; border-radius: 8px;
    padding: 7px 11px; font-size: 12.5px; cursor: pointer; transition: all .14s;
  }
  .ghost:hover { border-color: #cfdcf1; background: #f8fbff; color: var(--blue-dark); }
  .ghost.danger:hover { background: #fef2f2; border-color: #f3c9c9; color: var(--red); }

  /* ---------------- 主体 ---------------- */
  .main { flex: 1 1 auto; display: flex; min-height: 0; }

  .list-col {
    flex: 0 0 288px; background: #fff; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .list-tabs {
    display: flex; gap: 4px; padding: 12px 12px 0; border-bottom: 1px solid var(--line-soft);
  }
  .lt {
    flex: 1 1 0; border: none; background: none; cursor: pointer; padding: 9px 6px 11px;
    font-size: 12.5px; color: var(--muted); border-bottom: 2px solid transparent;
    transition: all .15s; font-weight: 500;
  }
  .lt.on { color: var(--blue-dark); border-bottom-color: var(--blue); font-weight: 600; }
  .lt .num {
    display: inline-block; min-width: 17px; padding: 0 5px; margin-left: 4px; border-radius: 999px;
    background: #fee2e2; color: #b91c1c; font-size: 10.5px; font-weight: 700; line-height: 16px;
  }
  .lt .num.zero { background: #eef2f7; color: #94a3b8; }
  .list { flex: 1 1 auto; overflow-y: auto; padding: 8px; }
  .item {
    border: 1px solid transparent; border-radius: 11px; padding: 10px 11px; cursor: pointer;
    transition: all .14s; margin-bottom: 4px;
  }
  .item:hover { background: #f7faff; }
  .item.on { background: #eef4ff; border-color: #d7e4fd; }
  .item .row1 { display: flex; align-items: center; gap: 7px; }
  .item .nm { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .cnt {
    flex: 0 0 auto; background: #fff1e6; color: #c2410c; border-radius: 999px;
    padding: 0 6px; font-size: 10px; font-weight: 700; line-height: 15px;
  }
  .item .tm { margin-left: auto; font-size: 10.5px; color: var(--faint); flex: 0 0 auto; }
  .item .last {
    font-size: 11.5px; color: var(--faint); margin-top: 4px; line-height: 1.5;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; }
  .dot.wait { background: var(--amber); box-shadow: 0 0 0 3px rgba(217,119,6,.14); }
  .dot.act { background: var(--green); }
  .list-empty { padding: 34px 16px; text-align: center; color: var(--faint); font-size: 12px; line-height: 1.8; }
  .list-empty .ic { font-size: 24px; opacity: .45; display: block; margin-bottom: 6px; }

  /* 聊天区 */
  .chat-col { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .chat-empty {
    flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--faint); font-size: 13px; gap: 10px; text-align: center; padding: 30px;
  }
  .chat-empty .big { font-size: 42px; opacity: .28; }
  .chat-empty b { color: #64748b; font-size: 14px; font-weight: 600; }

  .chat-hd {
    flex: 0 0 auto; height: 60px; background: #fff; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; padding: 0 20px;
  }
  .chat-hd .av {
    width: 34px; height: 34px; border-radius: 50%; background: #e8effd; color: var(--blue-dark);
    font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center;
  }
  .chat-hd b { font-size: 13.5px; display: block; }
  .chat-hd .sub { font-size: 11px; color: var(--faint); margin-top: 1px; }
  .chat-hd .acts { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .pill {
    display: inline-flex; align-items: center; gap: 4px; border-radius: 999px;
    padding: 3px 9px; font-size: 11px; font-weight: 600;
  }
  .pill.amber { background: #fff7ed; color: #c2410c; }
  .pill.green { background: #ecfdf3; color: #15803d; }
  .pill.gray { background: #f1f5f9; color: #64748b; }

  .msgs { flex: 1 1 auto; overflow-y: auto; padding: 20px 22px 8px; background: #f8fafd; }
  .day { text-align: center; font-size: 10.5px; color: #a8b4c8; margin: 6px 0 14px; }
  .bubble { display: flex; margin-bottom: 14px; align-items: flex-end; gap: 8px; }
  .bubble .body { max-width: 66%; }
  .bubble .who2 { font-size: 10.5px; color: var(--faint); margin-bottom: 4px; }
  .bubble .txt {
    padding: 10px 13px; border-radius: 13px; font-size: 13px; line-height: 1.65;
    background: #fff; border: 1px solid var(--line); white-space: pre-wrap; word-break: break-word;
    box-shadow: 0 1px 2px rgba(15,35,80,.03);
  }
  .bubble .tm2 { font-size: 10px; color: #b6c2d4; margin-top: 4px; }
  .bubble.user { justify-content: flex-start; }
  .bubble.user .body { text-align: left; }
  .bubble.staff { justify-content: flex-end; }
  .bubble.staff .body { text-align: right; }
  .bubble.staff .txt {
    background: linear-gradient(135deg, #3d7df6, var(--blue)); color: #fff; border-color: transparent;
    text-align: left; box-shadow: 0 3px 10px rgba(47,111,237,.22);
  }
  .bubble.ai .txt { background: #f1f5ff; border-color: #e0e8ff; }
  .bubble.system { justify-content: center; }
  .bubble.system .txt {
    background: transparent; border: none; box-shadow: none; color: #94a3b8; font-size: 11.5px; padding: 2px 8px;
  }

  .composer { flex: 0 0 auto; background: #fff; border-top: 1px solid var(--line); padding: 12px 18px 14px; }
  .quick { display: flex; gap: 7px; margin-bottom: 9px; flex-wrap: wrap; }
  .qk {
    border: 1px solid var(--line); background: #fbfdff; color: #5b6b84; border-radius: 999px;
    padding: 5px 11px; font-size: 11.5px; cursor: pointer; transition: all .14s;
  }
  .qk:hover { border-color: #c9dbf8; background: #f2f7ff; color: var(--blue-dark); }
  .composer-row { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1 1 auto; resize: none; border: 1px solid var(--line); border-radius: 11px;
    padding: 10px 13px; font-size: 13px; font-family: inherit; line-height: 1.6;
    background: #fbfdff; outline: none; height: 62px; transition: all .14s; color: var(--text);
  }
  textarea:focus { border-color: #b9cffa; box-shadow: 0 0 0 3px rgba(47,111,237,.10); background: #fff; }
  textarea:disabled { background: #f6f8fb; color: #a8b4c8; }
  .send {
    flex: 0 0 auto; border: none; border-radius: 10px; padding: 0 22px; height: 40px; cursor: pointer;
    background: linear-gradient(135deg, var(--blue), #3d63e8); color: #fff; font-size: 13px;
    font-weight: 600; box-shadow: 0 4px 12px rgba(47,111,237,.28); transition: filter .14s;
  }
  .send:hover { filter: brightness(1.06); }
  .send:disabled { opacity: .45; box-shadow: none; cursor: not-allowed; }
  .hint { font-size: 10.5px; color: #b6c2d4; margin-top: 7px; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 14px);
    background: #1e293b; color: #fff; font-size: 12.5px; padding: 10px 18px; border-radius: 10px;
    opacity: 0; pointer-events: none; transition: all .22s; z-index: 90;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: #b91c1c; }

  /* ---------------- 用户评价弹窗 ---------------- */
  .fbm {
    position: fixed; inset: 0; background: rgba(15,35,80,.34); backdrop-filter: blur(2px);
    display: none; align-items: center; justify-content: center; z-index: 95;
  }
  .fbm.on { display: flex; }
  .fbm-card {
    width: min(560px, 94vw); max-height: 82vh; display: flex; flex-direction: column;
    background: #fff; border-radius: 16px; overflow: hidden;
    box-shadow: 0 24px 70px rgba(15,35,80,.30);
  }
  .fbm-hd { display: flex; align-items: center; gap: 8px; padding: 15px 18px 10px; border-bottom: 1px solid #eef1f7; }
  .fbm-hd b { font-size: 15px; }
  .fbm-hd .sub { font-size: 12px; color: #64748b; }
  .fbm-hd .x {
    margin-left: auto; border: none; background: none; color: #94a3b8; cursor: pointer;
    font-size: 14px; padding: 4px 7px; border-radius: 8px; font-family: inherit;
  }
  .fbm-hd .x:hover { background: #f1f5f9; color: #1e293b; }
  .fbm-body { padding: 12px 18px 18px; overflow: auto; }
  .fbm-sum { display: flex; gap: 10px; margin-bottom: 12px; }
  .fbm-kpi {
    flex: 1 1 0; background: #f8fafc; border: 1px solid #eef1f7; border-radius: 10px;
    padding: 9px 12px;
  }
  .fbm-kpi .k { font-size: 11.5px; color: #64748b; }
  .fbm-kpi .v { font-size: 18px; font-weight: 600; margin-top: 2px; }
  .fbm-kpi .v small { font-size: 12px; font-weight: 400; color: #94a3b8; margin-left: 2px; }
  .fbm-sec { font-size: 12px; color: #64748b; margin: 14px 0 6px; }
  .fbm-item {
    border: 1px solid #eef1f7; border-radius: 10px; padding: 9px 12px; margin-bottom: 8px;
    background: #fff;
  }
  .fbm-item .top { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .fbm-item .top b { font-weight: 600; }
  .fbm-item .st { color: #f59e0b; letter-spacing: 1px; }
  .fbm-item .tp { margin-left: auto; font-size: 11.5px; color: #94a3b8; }
  .fbm-item .ct { font-size: 12.5px; color: #334155; line-height: 1.65; margin-top: 4px; }
  .fbm-item .tg { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 5px; }
  .fbm-item .tg i {
    font-style: normal; font-size: 11px; color: #475569; background: #f1f5f9;
    border-radius: 999px; padding: 2px 8px;
  }
  .fbm-empty { text-align: center; color: #94a3b8; font-size: 12.5px; padding: 26px 0; }

  @media (max-width: 860px) {
    .list-col { flex-basis: 232px; }
    .bubble .body { max-width: 82%; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path>
        <path d="M14 3v5h5"></path><path d="M9 13h6M9 17h4"></path>
      </svg>
    </div>
    <div><b>智能文档助手</b><span>客服端</span></div>
  </div>
  <div class="live"><i></i>在线接单</div>
  <div class="hdr-right">
    <button class="ghost" id="fb-btn" title="用户评价：我接待的会话收到的 + 全站客服评价">⭐ 评价 <em id="fb-n" style="font-style:normal;color:#b45309">0</em></button>
    <div class="who"><div class="av" id="me-av">客</div><span id="me-name">…</span></div>
    <a class="ghost" href="/" style="text-decoration:none">用户端</a>
    <button class="ghost danger" id="logout">退出</button>
  </div>
</header>

<div class="main">
  <aside class="list-col">
    <div class="list-tabs">
      <button class="lt on" data-tab="waiting">待接入 <span class="num zero" id="n-wait">0</span></button>
      <button class="lt" data-tab="mine">我接待的 <span class="num zero" id="n-mine">0</span></button>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <section class="chat-col">
    <div class="chat-empty" id="chat-empty">
      <div class="big">💬</div>
      <b>选一个会话开始接待</b>
      <span>左边「待接入」里是正在排队的用户，点开就能看到他的问题</span>
    </div>

    <div id="chat-wrap" style="display:none; flex:1 1 auto; flex-direction:column; min-height:0">
      <div class="chat-hd">
        <div class="av" id="cur-av">用</div>
        <div>
          <b id="cur-name">用户</b>
          <div class="sub" id="cur-sub"></div>
        </div>
        <div class="acts">
          <span class="pill amber" id="cur-status">排队中</span>
          <button class="ghost" id="accept" style="display:none">接入会话</button>
          <button class="ghost danger" id="close" style="display:none">结束会话</button>
        </div>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="composer">
        <div class="quick" id="quick">
          <button class="qk">你好，我是客服，请问遇到什么问题了？</button>
          <button class="qk">请把文档名告诉我，我帮你看一下</button>
          <button class="qk">稍等，我确认一下</button>
          <button class="qk">已经处理好了，还有其他问题吗？</button>
        </div>
        <div class="composer-row">
          <textarea id="input" placeholder="回复用户…（Enter 发送，Shift+Enter 换行）" disabled></textarea>
          <button class="send" id="send" disabled>发送</button>
        </div>
        <div class="hint">用户端每 1.5 秒拉一次消息，发出去基本实时到达</div>
      </div>
    </div>
  </section>
</div>

<div class="fbm" id="fbm">
  <div class="fbm-card">
    <div class="fbm-hd">
      <b>用户评价</b><span class="sub" id="fbm-sub">我接待的 + 全站客服评价</span>
      <button class="x" id="fbm-x" title="关闭">✕</button>
    </div>
    <div class="fbm-body" id="fbm-body"><div class="fbm-empty">加载中…</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const initial = (s) => String(s || "?").trim().slice(0, 1).toUpperCase();

let me = null;
let waiting = [], mine = [];
let tab = "waiting";
let cur = null;            // 当前打开的会话
let lastId = 0;
let pollTimer = null, listTimer = null;

function toast(text, err) {
  const t = $("toast");
  t.textContent = text;
  t.className = "toast on" + (err ? " err" : "");
  clearTimeout(t._t);
  t._t = setTimeout(() => { t.className = "toast" + (err ? " err" : ""); }, 2200);
}

async function api(path, opts) {
  const o = Object.assign({ headers: { "Content-Type": "application/json" } }, opts || {});
  const r = await fetch(path, o);
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (r.status === 401) { location.href = "/login?portal=staff"; throw new Error("登录已过期"); }
  if (r.status === 403) { location.href = "/login?portal=staff"; throw new Error("没有客服权限"); }
  if (!r.ok) throw new Error(j.detail || ("请求失败 HTTP " + r.status));
  return j;
}

/* ---------------- 列表 ---------------- */
async function loadList() {
  try {
    const j = await api("/api/staff/sessions");
    waiting = j.waiting || [];
    mine = j.mine || [];
    $("n-wait").textContent = waiting.length;
    $("n-wait").classList.toggle("zero", !waiting.length);
    $("n-mine").textContent = mine.length;
    $("n-mine").classList.toggle("zero", !mine.length);
    renderList();
    // 当前会话状态变了（被别人接走 / 已结束）同步一下
    if (cur) {
      const found = mine.find((s) => s.id === cur.id) || waiting.find((s) => s.id === cur.id);
      if (!found) { closeChat("这个会话已经结束了"); }
      else if (found.status !== cur.status || found.staff_name !== cur.staff_name) {
        cur = Object.assign({}, cur, found);
        renderChatHeader();
      }
    }
  } catch (e) { /* 轮询失败不刷屏，下次再试 */ }
}

function renderList() {
  const list = tab === "waiting" ? waiting : mine;
  if (!list.length) {
    $("list").innerHTML = `<div class="list-empty"><span class="ic">${tab === "waiting" ? "☕" : "📭"}</span>
      ${tab === "waiting" ? "现在没人排队，休息一下" : "还没有接待中的会话"}</div>`;
    return;
  }
  $("list").innerHTML = list.map((s) => `
    <div class="item ${cur && cur.id === s.id ? "on" : ""}" data-id="${s.id}">
      <div class="row1">
        <span class="dot ${s.status === "waiting" ? "wait" : "act"}"></span>
        <span class="nm">${esc(s.user_name || ("用户 #" + s.user_id))}</span>
        ${s.status === "waiting" && s.msg_count ? `<span class="cnt" title="他已经留言 ${s.msg_count} 条">${s.msg_count} 条留言</span>` : ""}
        ${s.rating ? `<span class="cnt" title="用户给这次会话打了 ${s.rating} 星" style="background:#fff7ed;color:#b45309">★ ${s.rating}</span>` : ""}
        <span class="tm">${esc((s.last_at || s.created_at || "").slice(11, 16))}</span>
      </div>
      <div class="last">${esc(s.last_text || "（还没有消息）")}</div>
    </div>`).join("");
}

$("list").onclick = (e) => {
  const it = e.target.closest(".item");
  if (!it) return;
  const id = Number(it.dataset.id);
  const s = waiting.concat(mine).find((x) => x.id === id);
  if (s) openChat(s);
};

document.querySelectorAll(".lt").forEach((b) => {
  b.onclick = () => {
    tab = b.dataset.tab;
    document.querySelectorAll(".lt").forEach((x) => x.classList.toggle("on", x === b));
    renderList();
  };
});

/* ---------------- 聊天 ---------------- */
function openChat(s) {
  cur = s;
  lastId = 0;
  $("msgs").innerHTML = "";
  $("chat-empty").style.display = "none";
  $("chat-wrap").style.display = "flex";
  renderChatHeader();
  renderList();
  pull(true);
  clearInterval(pollTimer);
  pollTimer = setInterval(() => pull(false), 1500);
}

function renderChatHeader() {
  const s = cur;
  if (!s) return;
  $("cur-name").textContent = s.user_name || ("用户 #" + s.user_id);
  $("cur-av").textContent = initial(s.user_name || "用");
  $("cur-sub").textContent = `会话 #${s.id} · ${s.created_at || ""}` +
    (s.staff_name ? " · 客服 " + s.staff_name : "");
  const st = $("cur-status");
  const active = s.status === "active";
  st.textContent = s.status === "waiting" ? "排队中" : active ? "接待中" : "已结束";
  st.className = "pill " + (s.status === "waiting" ? "amber" : active ? "green" : "gray");
  const isMine = active && s.staff_id === (me && me.id);
  $("accept").style.display = s.status === "waiting" ? "" : "none";
  $("close").style.display = isMine ? "" : "none";
  $("input").disabled = !isMine;
  $("send").disabled = !isMine;
  $("input").placeholder = isMine ? "回复用户…（Enter 发送，Shift+Enter 换行）"
    : (s.status === "waiting" ? "先点右上角「接入会话」再回复" : "会话已结束");
}

function bubbleHtml(m) {
  if (m.sender === "system") return `<div class="bubble system"><div class="txt">${esc(m.content)}</div></div>`;
  const isStaff = m.sender === "staff";
  const who = m.sender === "user" ? "用户" : m.sender === "ai" ? "智能客服" : (m.sender_name || "客服");
  return `<div class="bubble ${m.sender}"><div class="body">
    <div class="who2">${esc(who)} · ${esc((m.created_at || "").slice(11, 16))}</div>
    <div class="txt">${esc(m.content)}</div>
  </div></div>`;
}

async function pull(first) {
  if (!cur) return;
  try {
    const j = await api(`/api/staff/poll?session_id=${cur.id}&after=${first ? 0 : lastId}`);
    cur = Object.assign({}, cur, j.session);
    const box = $("msgs");
    if (first) {
      box.innerHTML = `<div class="day">${esc((cur.created_at || "").slice(0, 16))}</div>`;
    }
    for (const m of j.messages) {
      box.insertAdjacentHTML("beforeend", bubbleHtml(m));
      lastId = Math.max(lastId, m.id);
    }
    if (first || j.messages.length) box.scrollTop = box.scrollHeight;
    renderChatHeader();
  } catch (e) {
    if (/不存在|结束/.test(e.message)) closeChat(e.message);
  }
}

function closeChat(reason) {
  cur = null;
  clearInterval(pollTimer);
  $("chat-wrap").style.display = "none";
  $("chat-empty").style.display = "flex";
  if (reason) toast(reason);
  loadList();
}

$("accept").onclick = async () => {
  if (!cur) return;
  try {
    const j = await api("/api/staff/accept", { method: "POST",
      body: JSON.stringify({ session_id: cur.id }) });
    cur = j.session;
    tab = "mine";
    document.querySelectorAll(".lt").forEach((x) => x.classList.toggle("on", x.dataset.tab === "mine"));
    renderChatHeader();
    loadList();
    pull(false);
    $("input").focus();
    toast("已接入，可以开始回复了");
  } catch (e) { toast(e.message, true); }
};

$("close").onclick = async () => {
  if (!cur) return;
  if (!confirm("确定结束这次会话？结束后用户需要重新发起咨询。")) return;
  try {
    await api("/api/staff/close", { method: "POST", body: JSON.stringify({ session_id: cur.id }) });
    closeChat("会话已结束");
  } catch (e) { toast(e.message, true); }
};

async function send() {
  const text = $("input").value.trim();
  if (!text || !cur) return;
  $("input").value = "";
  $("input").style.height = "62px";
  try {
    const j = await api("/api/staff/send", { method: "POST",
      body: JSON.stringify({ session_id: cur.id, content: text }) });
    const box = $("msgs");
    box.insertAdjacentHTML("beforeend", bubbleHtml(j.message));
    lastId = Math.max(lastId, j.message.id);
    box.scrollTop = box.scrollHeight;
    loadList();
  } catch (e) {
    toast(e.message, true);
    $("input").value = text;
  }
}

$("send").onclick = send;
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("input").addEventListener("input", () => {
  const t = $("input");
  t.style.height = "auto";
  t.style.height = Math.min(140, Math.max(62, t.scrollHeight)) + "px";
});
$("quick").onclick = (e) => {
  const b = e.target.closest(".qk");
  if (!b || $("input").disabled) return;
  $("input").value = b.textContent;
  $("input").focus();
};

$("logout").onclick = async () => {
  try { await fetch("/api/auth/logout", { method: "POST" }); } catch (e) {}
  location.href = "/login?portal=staff";
};

/* ---------------- 用户评价 ---------------- */
function starText(n) { return "★★★★★".slice(0, n) + "☆☆☆☆☆".slice(0, 5 - n); }

function fbItemHtml(f) {
  return `<div class="fbm-item">
    <div class="top">
      <b>${esc(f.user_name || "用户")}</b>
      ${f.rating ? `<span class="st" title="${f.rating} 星">${starText(f.rating)}</span>` : `<span style="color:#94a3b8;font-size:12px">未打分</span>`}
      <span style="color:#94a3b8;font-size:11.5px">· ${esc(f.feature_text || "")}</span>
      <span class="tp">${esc((f.created_at || "").slice(5, 16))}</span>
    </div>
    ${f.content ? `<div class="ct">${esc(f.content)}</div>` : ""}
    ${f.tags ? `<div class="tg">${f.tags.split(",").filter(Boolean).map((t) => `<i>${esc(t)}</i>`).join("")}</div>` : ""}
  </div>`;
}

async function fbLoad() {
  const body = $("fbm-body");
  body.innerHTML = `<div class="fbm-empty">加载中…</div>`;
  try {
    const j = await api("/api/staff/feedback?limit=40");
    const mineList = j.mine || [], chats = j.chats || [];
    const avg = j.mine_avg || 0;
    let h = `<div class="fbm-sum">
      <div class="fbm-kpi"><div class="k">我收到的评价</div><div class="v">${mineList.length}<small>条</small></div></div>
      <div class="fbm-kpi"><div class="k">我的平均分</div><div class="v">${avg || "—"}<small>${avg ? "/ 5" : ""}</small></div></div>
      <div class="fbm-kpi"><div class="k">全站客服评价</div><div class="v">${chats.length}<small>条</small></div></div>
    </div>`;
    h += `<div class="fbm-sec">我接待的会话收到的评价</div>`;
    h += mineList.length ? mineList.map(fbItemHtml).join("")
                         : `<div class="fbm-empty">还没有人评价过你的接待<br>用户结束会话时会弹评价，评完这里就能看到</div>`;
    h += `<div class="fbm-sec">全站客服评价（参考别人怎么被评）</div>`;
    h += chats.length ? chats.slice(0, 12).map(fbItemHtml).join("")
                      : `<div class="fbm-empty">暂无客服相关评价</div>`;
    body.innerHTML = h;
    $("fbm-sub").textContent = `我 ${mineList.length} 条 · 平均 ${avg || "—"} 分`;
    $("fb-n").textContent = mineList.length;
  } catch (e) {
    body.innerHTML = `<div class="fbm-empty">加载失败：${esc(e.message)}</div>`;
  }
}

$("fb-btn").onclick = () => { $("fbm").classList.add("on"); fbLoad(); };
$("fbm-x").onclick = () => $("fbm").classList.remove("on");
$("fbm").onclick = (e) => { if (e.target === $("fbm")) $("fbm").classList.remove("on"); };

/* ---------------- 启动 ---------------- */
async function boot() {
  try {
    const r = await fetch("/api/auth/me");
    const j = await r.json();
    const u = j.user;
    if (!u || !(u.roles || []).includes("staff")) { location.href = "/login?portal=staff"; return; }
    me = u;
    $("me-name").textContent = u.display_name || u.username;
    $("me-av").innerHTML = u.avatar ? `<img src="${esc(u.avatar)}" alt="">` : esc(initial(u.display_name));
    await loadList();
    api("/api/staff/feedback?limit=5")
      .then((j) => { $("fb-n").textContent = (j.mine || []).length; })
      .catch(() => {});
    // 有排队就直接打开第一条，少点一次
    if (waiting.length) openChat(waiting[0]);
    listTimer = setInterval(loadList, 4000);
    setInterval(() => { api("/api/staff/heartbeat", { method: "POST" }).catch(() => {}); }, 15000);
    api("/api/staff/heartbeat", { method: "POST" }).catch(() => {});
  } catch (e) {
    location.href = "/login?portal=staff";
  }
}
boot();
</script>
